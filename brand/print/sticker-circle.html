<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  /* Circle die-cut sticker: trim 76mm circle + 3mm bleed = 82mm square doc */
  * { margin:0; padding:0; }
  @page { size: 82mm 82mm; margin:0; }
  body { width:82mm; height:82mm; overflow:hidden; background:#0f172a; }
  svg { display:block; }
</style></head><body>
<svg width="100%" height="100%" viewBox="0 0 820 820" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#16233d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <!-- ring text path: circle r=300 centered -->
    <path id="ringTop" d="M 410,410 m -300,0 a 300,300 0 1,1 600,0 a 300,300 0 1,1 -600,0" fill="none"/>
  </defs>
  <rect width="820" height="820" fill="url(#glow)"/>
  <!-- decorative outer ring (inside 76mm trim, safe of cut) -->
  <circle cx="410" cy="410" r="345" fill="none" stroke="#22d3ee" stroke-width="4" opacity="0.9"/>
  <circle cx="410" cy="410" r="332" fill="none" stroke="#334155" stroke-width="2"/>
  <!-- ring text -->
  <text font-family="SF Mono, Menlo, monospace" font-size="34" font-weight="700"
        fill="#22d3ee" letter-spacing="9">
    <textPath href="#ringTop" startOffset="0">PRODUCT HACKER · PRODUCTHACKER.AI · SHIP IT · HUMANS + AGENTS ·</textPath>
  </text>
  <!-- center monogram chip -->
  <rect x="290" y="270" width="240" height="240" rx="54" fill="#1e293b"
        stroke="#22d3ee" stroke-width="10"/>
  <text x="410" y="418" text-anchor="middle" font-family="-apple-system, Helvetica, sans-serif"
        font-size="118" font-weight="800" fill="#22d3ee">PH</text>
  <!-- terminal cursor accent under PH -->
  <rect x="384" y="448" width="52" height="12" fill="#22d3ee"/>
  <text x="410" y="588" text-anchor="middle" font-family="SF Mono, Menlo, monospace"
        font-size="30" font-weight="600" fill="#94a3b8" letter-spacing="6">0 VC · 9+ APPS</text>
</svg>
</body></html>
